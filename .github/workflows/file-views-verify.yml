name: File views native acceptance
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'src/Ai.Tlbx.MidTerm/Services/File*.cs'
      - 'src/Ai.Tlbx.MidTerm/Services/Git/GitCommandRunner.cs'
      - 'src/Ai.Tlbx.MidTerm/Services/Git/GitFileStatusMapBuilder.cs'
      - 'src/Ai.Tlbx.MidTerm/Services/Git/**'
      - 'src/Ai.Tlbx.MidTerm/src/ts/modules/git/gitCommands.ts'
      - 'src/Ai.Tlbx.MidTerm/Services/Sessions/SessionCallerIdentity.cs'
      - 'src/Ai.Tlbx.MidTerm/Services/Sessions/TtyHostSpawner.cs'
      - 'src/Ai.Tlbx.MidTerm.UnitTests/File*Tests.cs'
      - 'src/Ai.Tlbx.MidTerm.UnitTests/GitStatusParserTests.cs'
      - 'src/Ai.Tlbx.MidTerm.UnitTests/GitFileStatusMapTests.cs'
      - 'src/Ai.Tlbx.MidTerm.UnitTests/Git*Tests.cs'
      - 'src/Ai.Tlbx.MidTerm.UnitTests/SessionApiEndpointsTests.cs'
      - 'scripts/perf/tlbx-git-command-quoting.mjs'
      - 'scripts/test-file-service-identity.ps1'
      - '.github/workflows/file-views-verify.yml'
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: file-views-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native:
    name: Files native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Real filesystem acceptance
        shell: pwsh
        run: |
          dotnet test --project src/Ai.Tlbx.MidTerm.UnitTests/Ai.Tlbx.MidTerm.UnitTests.csproj -c Release -p:SkipFrontendBuild=true -p:RestoreLockedMode=true --filter-class '*FileOperationServiceTests*' --filter-class '*FileDocumentServiceTests*' --filter-class '*FileNavigationServiceTests*' --filter-class '*FileDirectoryServiceTests*' --filter-class '*FileServiceTests*' --filter-class '*SessionCallerIdentityTests*' --filter-class '*Git*' --filter-class '*SessionApiEndpointsTests*' --report-trx --report-trx-filename 'files-native.trx' --results-directory .dev/file-native-results -v:q
          if ($LASTEXITCODE -ne 0) { throw 'Native filesystem acceptance failed.' }
      - name: Install locked command transpiler dependencies
        working-directory: src/Ai.Tlbx.MidTerm
        run: npm ci --ignore-scripts
      - name: Real PowerShell and Bash command quoting
        shell: pwsh
        run: |
          $env:TLBX_PERF_ARTIFACT_ROOT = '.dev/file-native-results/git-command-quoting'
          node scripts/perf/tlbx-git-command-quoting.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Git command quoting acceptance failed.' }
      - name: Real LocalSystem caller boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-file-service-identity.ps1 -Configuration Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: file-native-${{ matrix.os }}
          path: |
            .dev/file-native-results/*.trx
            .dev/file-native-results/git-command-quoting/summary.json
            .dev/file-service-identity/*.log
            .dev/file-service-identity/*.trx
          retention-days: 7
